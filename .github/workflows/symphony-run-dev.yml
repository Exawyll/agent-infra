name: Symphony run-dev

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Linear internal issue ID (UUID)"
        required: true
      ticket_identifier:
        description: "Linear human identifier, ex. RALPH-42"
        required: true
      title:
        description: "Ticket title"
        required: true
      acceptance_criteria:
        description: "Ticket acceptance criteria (from the Linear description)"
        required: true
      repo:
        description: "owner/repo this run must operate on — guard against dispatch drift, not a routing switch"
        required: true
      attempt:
        description: "1 = first run, 2/3 = auto-correction after a CI failure"
        required: true
        default: "1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: symphony-run-dev-${{ github.event.inputs.ticket_id }}
  cancel-in-progress: false

jobs:
  run-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TICKET_ID: ${{ github.event.inputs.ticket_id }}
      TICKET_IDENTIFIER: ${{ github.event.inputs.ticket_identifier }}
      TICKET_TITLE: ${{ github.event.inputs.title }}
      # Repository *variable* (Settings → Secrets and variables → Actions → Variables),
      # pas un secret — c'est une URL publique, pas une donnée sensible (l'accès est
      # protégé par LITELLM_AGENT_DEV_KEY, une clé virtuelle scopée, jamais la master
      # key). Tailscale a été décommissionné sur KVM2 (juillet 2026) ; LiteLLM est
      # exposé en HTTPS via Traefik comme n8n. Valeur actuelle : https://litellm.srv1787569.hstgr.cloud
      LITELLM_URL: ${{ vars.LITELLM_PUBLIC_URL }}
      ACCEPTANCE_CRITERIA: ${{ github.event.inputs.acceptance_criteria }}
      ATTEMPT: ${{ github.event.inputs.attempt }}
      BRANCH_NAME: feat/${{ github.event.inputs.ticket_identifier }}-symphony-run
    steps:
      - name: Guard — repo param must match dispatch target
        run: |
          if [ "${{ github.event.inputs.repo }}" != "${{ github.repository }}" ]; then
            echo "::error::repo input (${{ github.event.inputs.repo }}) does not match ${{ github.repository }} — refusing to act on the wrong repo."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity check — LiteLLM reachable
        run: |
          curl -sf --max-time 10 "$LITELLM_URL/health" \
            || { echo "::error::LiteLLM unreachable — check Traefik/DNS for litellm.\${DOMAIN_NAME} before assuming an agent failure."; exit 1; }

      - name: Checkout or create ticket branch
        run: |
          git config user.name "symphony-agent-dev"
          git config user.email "agent-dev@symphony.invalid"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code (headless, routed through LiteLLM — never a direct Anthropic key)
        env:
          ANTHROPIC_BASE_URL: ${{ vars.LITELLM_TAILSCALE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.LITELLM_AGENT_DEV_KEY }}
        run: |
          cat > /tmp/prompt.md <<EOF
          Tu travailles dans le repo agent-infra sur le ticket Linear ${TICKET_IDENTIFIER} : "${TICKET_TITLE}".

          Critères d'acceptation :
          ${ACCEPTANCE_CRITERIA}

          Tentative ${ATTEMPT}/3.

          Règles absolues (SPEC.md de ce repo) :
          - Jamais de secret en clair dans un commit, un diff, ou ta sortie — seul l'emplacement d'un secret
            peut être mentionné, jamais sa valeur.
          - Jamais de modification de budgets, clés API, ou limites de dépense.
          - Reste strictement dans le périmètre des critères d'acceptation ci-dessus.
          - Commit tes changements sur la branche courante avec un message conventionnel
            (cf. .claude/rules/git-conventions.md) une fois le travail terminé. Ne push pas toi-même —
            le workflow s'en charge après ton run.
          EOF
          claude -p "$(cat /tmp/prompt.md)" \
            --output-format json \
            --dangerously-skip-permissions \
            > /tmp/claude-run.json
          cat /tmp/claude-run.json

      - name: Push branch
        id: push
        run: |
          if git diff --quiet HEAD~1 2>/dev/null && [ "$(git rev-list --count HEAD ^origin/main 2>/dev/null || echo 1)" = "0" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No commits produced by this run."
          else
            git push -u origin "$BRANCH_NAME"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update PR
        id: pr
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "$BRANCH_NAME" >/dev/null 2>&1; then
            gh pr edit "$BRANCH_NAME" --body "$(cat <<EOF
          Closes ${TICKET_IDENTIFIER}

          ${TICKET_TITLE}

          Tentative ${ATTEMPT}/3 — mise à jour automatique après un run d'auto-correction.

          Co-Authored-By: Symphony agent-dev <agent-dev@symphony.invalid>
          EOF
          )"
          else
            gh pr create \
              --title "${TICKET_IDENTIFIER}: ${TICKET_TITLE}" \
              --body "$(cat <<EOF
          Closes ${TICKET_IDENTIFIER}

          ${TICKET_TITLE}

          Tentative ${ATTEMPT}/3.

          Co-Authored-By: Symphony agent-dev <agent-dev@symphony.invalid>
          EOF
          )"
          fi
          echo "pr_url=$(gh pr view "$BRANCH_NAME" --json url -q .url)" >> "$GITHUB_OUTPUT"

      - name: Report back to n8n
        if: always()
        env:
          REPORT_SECRET: ${{ secrets.RUN_DEV_REPORT_SECRET }}
          N8N_REPORT_URL: ${{ secrets.N8N_RUN_DEV_REPORT_URL }}
        run: |
          BODY=$(jq -n \
            --arg ticket_id "$TICKET_ID" \
            --arg ticket_identifier "$TICKET_IDENTIFIER" \
            --arg attempt "$ATTEMPT" \
            --arg pushed "${{ steps.push.outputs.pushed || 'false' }}" \
            --arg pr_url "${{ steps.pr.outputs.pr_url || '' }}" \
            --arg run_status "${{ job.status }}" \
            '{ticket_id: $ticket_id, ticket_identifier: $ticket_identifier, attempt: ($attempt | tonumber), pushed: ($pushed == "true"), pr_url: $pr_url, run_status: $run_status}')
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$REPORT_SECRET" | sed 's/^.* //')
          curl -sf -X POST "$N8N_REPORT_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $SIGNATURE" \
            -d "$BODY"
