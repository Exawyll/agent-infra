# Branche les contrôles locaux d'agent-infra sur le framework pre-commit.
# Utile sur un poste où un core.hooksPath global (ex. hook Aikido) court-circuite
# .git/hooks/ mais délègue à pre-commit quand ce fichier existe.
# La logique vit dans .git-hooks/pre-commit (source unique) : ne pas la dupliquer ici.
repos:
  - repo: local
    hooks:
      - id: agent-infra-checks
        name: gitleaks + contrôles locaux (scripts/pre-pr-check.sh)
        entry: .git-hooks/pre-commit
        language: system
        always_run: true
        pass_filenames: false
