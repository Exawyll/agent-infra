# LiteLLM Proxy Config — juillet 2026
# rapide      → DeepSeek V4 Flash (veille, agent-pro, agent-perso)
# code        → GLM-5.2 via OpenRouter (agent-dev)
# review      → Kimi K3 via OpenRouter (agent-dev)
# raisonnement → DeepSeek V4 Pro (agent-pro, agent-perso)

model_list:
  # Rapide : tâches simples, veille — V4 Flash direct
  - model_name: rapide
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  # Code : génération et debugging — GLM-5.2 via OpenRouter
  - model_name: code
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.00000079

  # Review : code review + consolidation — Kimi K3 (OpenRouter)
  - model_name: review
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  # Raisonnement : planification, architecture — V4 Pro direct
  - model_name: raisonnement
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 600
  cache: true
  cache_params:
    type: s2
    mode: default

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
