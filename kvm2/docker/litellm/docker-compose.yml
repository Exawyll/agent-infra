version: "3.7"

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.55.0
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - DATABASE_URL=sqlite:///app/db/litellm.db
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - litellm_data:/app/db
      - ./config.yaml:/app/config.yaml:ro
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"

volumes:
  litellm_data:
