version: "3.7"

services:
  traefik:
    image: "traefik:v3.7.8"
    restart: always
    command:
      - "--api=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.55.0
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@litellm-postgres:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - litellm_configs:/app/db
      - ./litellm-config.yaml:/app/config.yaml:ro
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"

  litellm-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.30.7
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_TEMPLATES_ENABLED=true
      - N8N_TEMPLATES_HOST=https://api.n8n.io/api/
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_BACKLOG_DB=${NOTION_BACKLOG_DB}
      - NOTION_STATE_DB=${NOTION_STATE_DB}
      - NOTION_DECISIONS_DB=${NOTION_DECISIONS_DB}
      - PO_EMAIL=${PO_EMAIL}
      - TELEGRAM_CHAT_ID_DEV=${TELEGRAM_CHAT_ID_DEV}
      - LINEAR_WEBHOOK_SECRET=${LINEAR_WEBHOOK_SECRET}
      - LINEAR_API_KEY=${LINEAR_API_KEY}
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID}
      - LINEAR_STATE_READY=${LINEAR_STATE_READY}
      - LINEAR_STATE_IN_PROGRESS=${LINEAR_STATE_IN_PROGRESS}
      - LINEAR_TYPE_LABELS=${LINEAR_TYPE_LABELS}
      - SYMPHONY_TICKET_SECRET=${SYMPHONY_TICKET_SECRET}
      - SYMPHONY_EXECUTOR_SECRET=${SYMPHONY_EXECUTOR_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
      - /local-files:/files
      - /var/local/hermes/factfulness_log.json:/files/factfulness_log.json:ro

  symphony-executor:
    build:
      context: ../../../
      dockerfile: kvm2/docker/symphony-executor/Dockerfile
    restart: always
    env_file:
      - ${HOME}/.hermes/profiles/worker/.env
    environment:
      - LITELLM_BASE_URL=http://litellm:4000/v1/chat/completions
      - SYMPHONY_EXECUTOR_SECRET=${SYMPHONY_EXECUTOR_SECRET}
    volumes:
      # Dedicated clone (managed by symphony-executor.py itself), never a bind
      # mount of the host's live ops checkout: the worker runs LLM-generated
      # code with a terminal toolset, so its blast radius must stay inside a
      # sandbox the executor owns, not the same tree deploy.sh/humans use.
      - symphony_repo_data:/root/agent-infra
      # Only the worker's own profile — NOT the whole ~/.hermes tree, which
      # also holds the veille/dev/assistant/pro profiles' virtual keys.
      - ${HOME}/.hermes/profiles/worker:/root/.hermes/profiles/worker
      - /usr/local/bin/hermes:/usr/local/bin/hermes:ro
      # The wrapper at /usr/local/bin/hermes execs into this venv, whose own
      # python3 is itself a symlink into the uv-managed standalone interpreter
      # below — both are needed, the wrapper alone 404s at runtime.
      - /usr/local/lib/hermes-agent:/usr/local/lib/hermes-agent:ro
      - /usr/local/share/uv:/usr/local/share/uv:ro
    working_dir: /root/agent-infra

networks:
  default:
    name: n8n_default

volumes:
  traefik_data:
    external: true
    name: traefik_data
  n8n_data:
    external: true
    name: n8n_data
  litellm_configs:
  litellm_postgres_data:
  symphony_repo_data:
