# LiteLLM Proxy Config — Migration API DeepSeek directe
# rapide → GLM-5.2 (OpenRouter)
# code   → V4 Pro (DeepSeek direct, fallback → rapide)
# review → Kimi K3 (OpenRouter, ex-Claude Opus 4.8)
# raisonnement → V4 Pro (DeepSeek direct)

model_list:
  # Rapide : tâches simples, veille — GLM-5.2 via OpenRouter
  - model_name: rapide
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.00000079

  # Code : génération et debugging — V4 Pro direct
  - model_name: code
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
    fallbacks:
      - rapide

  # Review : code review + consolidation — Kimi K3 (OpenRouter)
  - model_name: review
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  # Raisonnement : planification, architecture — V4 Pro direct
  - model_name: raisonnement
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
