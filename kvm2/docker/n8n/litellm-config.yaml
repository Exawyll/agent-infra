# LiteLLM Proxy Config — 4 alias : rapide, code, review, raisonnement
# Modèles OpenRouter juillet 2026

model_list:
  # Rapide : tâches simples, veille — V4 Flash
  - model_name: rapide
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # Code : génération et debugging — V4 Flash
  - model_name: code
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # Review : code review + consolidation — Opus 4
  - model_name: review
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.8
      api_key: os.environ/OPENROUTER_API_KEY

  # Raisonnement : planification, architecture — V4 Pro
  - model_name: raisonnement
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
