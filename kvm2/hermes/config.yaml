# Hermes — profil default (~/.hermes/config.yaml) : OVERLAY, pas une config complète.
#
# Le fichier déployé est généré et migré par Hermes lui-même (~800 lignes,
# `_config_version`) : on ne l'écrase jamais. `deploy.sh hermes`
# (deploy_default_profile_config) remplace UNIQUEMENT les clés de premier niveau (model, fallback_providers, web)
# présentes ici et laisse tout le reste intact (sauvegarde horodatée avant écriture).
#
# Clé : agent-default (SOPS LITELLM_KEY_AGENT_DEFAULT) → rapide + raisonnement.
# Ne PAS mettre la clé en clair ici : elle est injectée au déploiement.
#
# Pas de fallback côté Hermes : LiteLLM gère la chaîne de secours
# (router_settings.fallbacks dans kvm2/docker/n8n/litellm-config.yaml :
# rapide → deepseek-flash ; raisonnement → code → deepseek-flash).

model:
  default: rapide
  provider: custom
  base_url: http://127.0.0.1:4000/v1
  api_key: PLACEHOLDER_REPLACE_LOCALLY
  api_mode: chat_completions

fallback_providers: []

# Recherche/extraction web via la clé Firecrawl directe (FIRECRAWL_API_KEY,
# injectée dans ~/.hermes/.env par upsert_default_profile_env). Avec
# use_gateway: true, Hermes force le Nous Tool Gateway même si la clé directe est
# présente — sans abonnement Nous, web_search/web_extract échouent tous
# (« Web tools are not configured »).
web:
  backend: firecrawl
  search_backend: ''
  extract_backend: ''
  use_gateway: false
