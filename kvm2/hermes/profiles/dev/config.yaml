# Hermes Profile — Dev (Code Review & Development)
# Mode : code (défaut) + review (code review)
# Provider: custom → LiteLLM (api_key stockée dans le .env du profil)
# Ne PAS mettre la clé en clair ici — la copie locale à ~/.hermes/profiles/ contient la vraie clé

model:
  default: code
  provider: custom
  base_url: http://127.0.0.1:4000/v1
  api_key: PLACEHOLDER_REPLACE_LOCALLY
  api_mode: chat_completions

providers: {}

fallback_providers: []
credential_pool_strategies: {}

toolsets:
  - web
  - terminal
  - file
  - delegation
  - skills

agent:
  max_turns: 150
  gateway_timeout: 1800
  api_max_retries: 3
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: "Profil Dev — code review, PR, tests"
  coding_context: auto
  verify_on_stop: auto
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  verbose: false
  reasoning_effort: medium

terminal:
  backend: local
  timeout: 180
  home_mode: auto
  auto_source_bashrc: true
  cwd: /root/agent-infra

web:
  backend: firecrawl

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

display:
  compact: false
  language: en
  platforms:
    telegram:
      streaming: true

telegram:
  allowed_chats: "8262789577"
  extra:
    rich_messages: true
    rich_drafts: false

gateway:
  allowed_user_ids:
    - "8262789577"

moa:
  default_preset: code-review
  active_preset: code-review
  presets:
    code-review:
      enabled: true
      reference_models:
        - provider: custom
          model: review
      aggregator:
        provider: custom
        model: review
      reference_temperature: 0.6
      aggregator_temperature: 0.4
      max_tokens: 4096
