# Hermes Profile — Veille
# Provider: custom → LiteLLM
# Modèle rapide UNIQUEMENT — clé virtuelle agent-veille
# api_key = clé veille (dans ~/.hermes/profiles/veille/config.yaml local)

model:
  default: rapide
  provider: custom
  base_url: http://127.0.0.1:4000/v1
  api_key: PLACEHOLDER_REPLACE_LOCALLY
  api_mode: chat_completions

providers: {}
fallback_providers: []
credential_pool_strategies: {}

toolsets:
  - web
  - file

agent:
  max_turns: 50
  gateway_timeout: 600
  api_max_retries: 2
  disabled_toolsets:
    - terminal
    - delegation
    - skills
    - browser
    - clarify
    - todo
    - memory
    - session_search
    - cronjob
    - computer_use
  verbose: false
  reasoning_effort: low

terminal:
  backend: local
  timeout: 60

web:
  backend: firecrawl

memory:
  memory_enabled: false
  user_profile_enabled: false

display:
  compact: true
  language: fr

telegram:
  allowed_chats: "8262789577"

gateway:
  allowed_user_ids:
    - "8262789577"
