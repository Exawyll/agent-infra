# Hermes Profile — Worker (Symphony Executor)
# Mode : code
# Provider: custom → LiteLLM (api_key stockée dans le .env du profil)

model:
  default: code
  provider: custom
  base_url: http://127.0.0.1:4000/v1
  api_key: PLACEHOLDER_REPLACE_LOCALLY
  api_mode: chat_completions

providers: {}
fallback_providers: []
credential_pool_strategies: {}

toolsets:
  - web
  - terminal
  - file
  - skills

agent:
  max_turns: 150
  gateway_timeout: 1800
  api_max_retries: 3
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: "Profil Worker Symphony — exécution en worktree, tests avant commit."
  coding_context: auto
  verify_on_stop: auto
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  verbose: true
  reasoning_effort: high

terminal:
  backend: local
  timeout: 300
  home_mode: auto
  auto_source_bashrc: true

web:
  backend: firecrawl

memory:
  memory_enabled: false

display:
  compact: true
  language: en

# Le worker ne s'exécute pas en gateway/webhook pour Telegram, il est invoqué par l'exécuteur HTTP.
telegram:
  allowed_chats: ""
